{% extends "base.html" %}{% from "_macros.html" import banner %}
{% block body %}{{ banner() }}{% if not y %}<div class="card">No election is open yet.</div>{% endif %}
<div class="grid"><div class="card"><h3>Sign in</h3><form method="post" action="/login">{{ csrf() }}<input name="sid" placeholder="Student ID" required autocomplete="username"><input name="pw" type="password" placeholder="Password" required autocomplete="current-password"><button class="b">Sign in</button></form></div>
<div class="card"><h3>Create account</h3><form method="post" action="/register">{{ csrf() }}<input name="sid" placeholder="Student ID" required><input name="email" type="email" placeholder="Email used on the membership form" required><input name="pw" type="password" placeholder="Choose a password (6+ characters)" required autocomplete="new-password"><button class="b t">Register</button></form><p class="mut">Only students on this year's registered members list can create an account.</p></div></div>{% endblock %}
